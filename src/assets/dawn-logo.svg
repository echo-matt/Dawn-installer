<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 130" width="176" height="114" fill="none">
  <defs>
    <!-- Soft luminous glow matching reference -->
    <filter id="dawnGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g fill="#1a78ff" filter="url(#dawnGlow)">
    <!-- Sun Semi-circle -->
    <path d="M 52 74 A 48 48 0 0 1 148 74 Z" />

    <!-- 13 Radiating Rays - Bold and sharp needles -->
    <!-- Center top vertical (90 deg) -->
    <polygon points="98.0,56 102.0,56 100,0" />

    <!-- ~76 deg (left & right) -->
    <polygon points="89.5,57.5 93.3,58.5 83.5,6" />
    <polygon points="106.7,58.5 110.5,57.5 116.5,6" />

    <!-- ~62 deg (left & right) -->
    <polygon points="81.2,60.0 84.6,61.4 69.0,16" />
    <polygon points="115.4,61.4 118.8,60.0 131.0,16" />

    <!-- ~48 deg (left & right) -->
    <polygon points="73.8,63.2 76.8,65.0 56.5,30" />
    <polygon points="123.2,65.0 126.2,63.2 143.5,30" />

    <!-- ~34 deg (left & right) -->
    <polygon points="67.8,67.0 70.4,69.0 46.5,47" />
    <polygon points="129.6,69.0 132.2,67.0 153.5,47" />

    <!-- ~20 deg (left & right) -->
    <polygon points="63.2,71.2 65.4,73.4 39.5,66" />
    <polygon points="134.6,73.4 136.8,71.2 160.5,66" />

    <!-- ~7 deg (left & right lowest horizontal rays) -->
    <polygon points="60.2,75.4 61.8,77.8 35.5,80" />
    <polygon points="138.2,77.8 139.8,75.4 164.5,80" />

    <!-- Horizon Line -->
    <rect x="25" y="83" width="150" height="3" rx="1.5" />

    <!-- Ocean water reflection bars -->
    <rect x="42" y="89.5" width="116" height="2.5" rx="1.25" />
    <rect x="58" y="95" width="84" height="2.2" rx="1.1" />
    <rect x="72" y="100" width="56" height="2.0" rx="1.0" />
    <rect x="83" y="104.5" width="34" height="1.6" rx="0.8" />
    <rect x="91.5" y="108.5" width="17" height="1.3" rx="0.65" />
    <rect x="96" y="112" width="8" height="1.0" rx="0.5" />
  </g>
</svg>
